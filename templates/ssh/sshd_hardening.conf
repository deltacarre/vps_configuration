# Managed by VPS Configuration Script

# 启用公钥认证
PubkeyAuthentication yes

# 禁用密码认证
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# 禁止 root 登录
PermitRootLogin no

# 只允许指定用户登录
AllowUsers {{ VPS_USER }}

# 使用 PAM
UsePAM yes

# 其他安全设置
X11Forwarding no
MaxAuthTries 3
MaxSessions 2
