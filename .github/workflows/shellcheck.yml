name: ShellCheck

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './scripts'
        severity: warning
        format: tty
      env:
        SHELLCHECK_OPTS: -e SC1091
    
    - name: Check install.sh
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './'
        check_together: 'yes'
        additional_files: 'install.sh'
        severity: warning
