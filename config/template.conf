# VPS 配置文件模板
# 复制此文件并根据你的需求修改

#======================================
# 用户配置
#======================================
VPS_USER="admin"
VPS_HOSTNAME="my-vps-server"

#======================================
# SSH 配置
#======================================
# SSH 公钥（必填，用于密钥认证）
SSH_PUBKEY=""

# SSH 公钥文件路径（可选，如果设置了 SSH_PUBKEY 则忽略）
SSH_PUBKEY_FILE=""

# SSH 端口（默认: 22）
SSH_PORT="22"

# 是否修改 SSH 端口（yes/no）
SSH_CHANGE_PORT="no"

# 禁用 root SSH 登录（yes/no）
SSH_DISABLE_ROOT="yes"

# 禁用密码登录（yes/no）
SSH_DISABLE_PASSWORD="yes"

#======================================
# 防火墙配置
#======================================
# 额外要开放的端口（逗号分隔，例如: 80,443,8080）
FIREWALL_EXTRA_PORTS=""

#======================================
# Fail2ban 配置
#======================================
# 最大重试次数
F2B_MAXRETRY="5"

# 查找时间窗口
F2B_FINDTIME="10m"

# 封禁时间
F2B_BANTIME="6h"

#======================================
# 时区配置
#======================================
TIMEZONE="Asia/Hong_Kong"

#======================================
# Swap 配置
#======================================
# 是否创建 swapfile（yes/no）
SWAP_CREATE="no"

# Swapfile 大小（例如: 1G, 2G, 4G）
SWAP_SIZE="2G"

# Swappiness 值（0-100，推荐 10）
SWAP_SWAPPINESS="10"

# VFS 缓存压力（0-100，推荐 50）
SWAP_CACHE_PRESSURE="50"

#======================================
# 模块启用开关
#======================================
# 启用用户管理（yes/no）
ENABLE_USER_SETUP="yes"

# 启用主机名设置（yes/no）
ENABLE_HOSTNAME_SETUP="yes"

# 启用软件包安装（yes/no）
ENABLE_PACKAGE_INSTALL="yes"

# 启用 SSH 安全加固（yes/no）
ENABLE_SSH_HARDENING="yes"

# 启用防火墙（yes/no）
ENABLE_FIREWALL="yes"

# 启用 Fail2ban（yes/no）
ENABLE_FAIL2BAN="yes"

# 启用时区设置（yes/no）
ENABLE_TIMEZONE="yes"

# 启用 APT 优化（yes/no）
ENABLE_APT_OPTIMIZATION="yes"

# 启用 Swap 优化（yes/no）
ENABLE_SWAP="yes"

# 启用 BBR 网络优化（yes/no）
ENABLE_BBR="yes"

#======================================
# 高级配置
#======================================
# 交互模式（yes/no）
# yes: 脚本会询问用户输入
# no: 完全使用配置文件中的值
INTERACTIVE_MODE="no"

# 详细输出（yes/no）
VERBOSE="yes"

# 创建系统报告（yes/no）
CREATE_REPORT="yes"

# 报告保存路径
REPORT_PATH="/root/vps_init_report.txt"
